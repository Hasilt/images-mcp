[project]
name = "stock-image-mcp"
version = "0.1.0"
description = "MCP server for searching and downloading stock images (Unsplash, Pexels, Pixabay, Freepik, StockVault, Burst) via LLM tool calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hasil T", email = "contact.hasil@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "stock-images", "unsplash", "pexels", "pixabay", "seo", "blogging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mcp[cli]>=1.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.urls]
Homepage = "https://github.com/Hasilt/images-mcp"
Repository = "https://github.com/Hasilt/images-mcp"
Issues = "https://github.com/Hasilt/images-mcp/issues"

[project.scripts]
stock-image-mcp = "stock_image_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
